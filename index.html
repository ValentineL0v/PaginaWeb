<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Paisajes Naturales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="encabezado-principal">
        <h1>Paisajes Naturales del Mundo</h1>
        <p>Una breve mirada a la diversidad botánica y geográfica de nuestro planeta.</p>
    </header>

    <main class="galeria-contenedor">
        <!-- Bloque del primer paisaje -->
        <figure class="tarjeta-paisaje">
            <img src="pradera.png" alt="Paisaje de una Pradera" class="imagen-adaptable">
            <figcaption class="descripcion-paisaje">
                <strong>Pradera:</strong> Una extensa llanura montañosa cubierta de vegetación herbácea, flores silvestres y árboles dispersos bajo un cielo despejado.
            </figcaption>
        </figure>

        <!-- Bloque del segundo paisaje -->
        <figure class="tarjeta-paisaje">
            <img src="selva.png" alt="Paisaje de una Selva" class="imagen-adaptable">
            <figcaption class="descripcion-paisaje">
                <strong>Selva:</strong> Un ecosistema tropical denso y húmedo, caracterizado por su abundante vegetación de hojas grandes y pequeños cuerpos de agua interiores.
            </figcaption>
        </figure>
    </main>

    <footer class="pie-pagina">
        <p>© 2026 - Trabajo de Evaluación Geográfica</p>
    </footer>

</body>
</html>
